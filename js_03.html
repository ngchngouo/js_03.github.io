<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi năm dương lịch sang năm âm lịch</title>
</head>
<body>
     <h2>Đổi năm dương lịch sang năm âm lịch</h2>
     <script>
        let nam_duong_lich = parseInt(prompt("Nhập năm dương lịch:"));

        let can = "";
        let chi = "";

     // Tính Can
     switch (nam_duong_lich % 10) {
      case 0: can = "Canh"; break;
      case 1: can = "Tân"; break;
      case 2: can = "Nhâm"; break;
      case 3: can = "Quý"; break;
      case 4: can = "Giáp"; break;
      case 5: can = "Ất"; break;
      case 6: can = "Bính"; break;
      case 7: can = "Đinh"; break;
      case 8: can = "Mậu"; break;
      case 9: can = "Kỷ"; break;
      }

     // Tính Chi
     switch (nam_duong_lich % 12) {
      case 0: chi = "Thân"; break;
      case 1: chi = "Dậu"; break;
      case 2: chi = "Tuất"; break;
      case 3: chi = "Hợi"; break;
      case 4: chi = "Tý"; break;
      case 5: chi = "Sửu"; break;
      case 6: chi = "Dần"; break;
      case 7: chi = "Mão"; break;
      case 8: chi = "Thìn"; break;
      case 9: chi = "Tỵ"; break;
      case 10: chi = "Ngọ"; break;
      case 11: chi = "Mùi"; break;
     }

     // Ghép Can và Chi
     let nam_am_lich = can + " " + chi;

     alert("Năm âm lịch là: " + nam_am_lich);
     document.write("Năm dương lịch: " + nam_duong_lich);
    document.write("<br>Năm âm lịch: " + nam_am_lich);
     </script>
</body>
</html>
